name: Build and publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Released version, e.g. 1.2.0'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            tags="${image}:${version},${image}:latest"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Cannot use 'latest' as a manual image tag."
              exit 1
            fi
            tags="${image}:${version}"
          else
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
          fi
          echo "image_ref=${image}:${version}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Docker build summary
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          manifest=$(jq --arg image "$IMAGE_REF" '.docker_image = $image' gladys-assistant-integration.json)
          {
            echo "## Docker build summary"
            echo
            echo "Image: \`$IMAGE_REF\`"
            echo
            echo '```json'
            echo "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
