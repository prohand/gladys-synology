name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the one declared in package.json engines, the upper one is the
        # version shipped in the Docker image.
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker:
    # Builds the image on every pull request without pushing it, so a broken Dockerfile (or a
    # dependency that no longer installs with `npm ci --omit=dev`) shows up before the release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false

  store:
    # The store indexer's own admission checks (manifest schema, version
    # couplings, cover, image). Pull requests only: a release commit reaches main
    # before build.yml has pushed its image, and the check refuses a missing one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate like the store indexer
        run: npx --yes github:GladysAssistant/integration-store .
